<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnamious Systems - Sophos Audit Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            overflow: hidden;
        }
        .cyber-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 80% 30%, rgba(0, 255, 136, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 40% 70%, rgba(255, 0, 255, 0.1) 0%, transparent 20%);
            z-index: 0;
        }
        .glitch-text {
            position: relative;
            display: inline-block;
            color: #00d4ff;
            font-weight: 800;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            opacity: 0.8;
            background: transparent;
            clip: rect(0, 0, 0, 0);
        }
        .glitch-text@keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.4; }
        }
        .login-container {
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.1),
                0 0 40px rgba(0, 136, 255, 0.1),
                inset 0 0 20px rgba(0, 255, 255, 0.05);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d4ff, #00ff88, #00d4ff);
            animation: gradientShift 3s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .company-logo {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
        }
        .company-logo .logo-main {
            display: inline-block;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            position: relative;
            overflow: hidden;
        }
        .company-logo .logo-main::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .company-logo .logo-main svg {
            width: 40px;
            height: 40px;
            fill: #0a0a0a;
        }
        .company-logo h1 {
            font-size: 28px;
            font-weight: 800;
            color: #e2e8f0;
            margin-bottom: 8px;
            background: linear-gradient(to right, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .company-logo p {
            color: #94a3b8;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 300;
        }
        .company-logo p span {
            color: #00d4ff;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(10, 10, 26, 0.5);
            color: #e2e8f0;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }
        .form-group input::placeholder {
            color: #64748b;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00d4ff 0%, #00ff88 100%);
            border: none;
            border-radius: 8px;
            color: #0a0a0a;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s, filter 0.3s;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.4);
            filter: brightness(1.1);
        }
        .btn:active {
            transform: translateY(0);
        }
        .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fecaca;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        .credentials {
            margin-top: 24px;
            padding: 16px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            font-size: 13px;
        }
        .credentials p {
            margin: 6px 0;
            color: #94a3b8;
        }
        .credentials code {
            background: rgba(10, 10, 26, 0.8);
            padding: 2px 10px;
            border-radius: 4px;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.05), transparent);
            animation: scan 8s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="scan-line"></div>

    <div class="login-container">
        <div class="company-logo">
            <div class="logo-main">
                <svg viewBox="0 0 64 64">
                    <rect width="64" height="64" rx="14" fill="#ffffff"/>
                    <text x="32" y="32" dy="0.35em" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#00a896">SA</text>
                </svg>
            </div>
            <h1>Sophos Audit Manager</h1>
            <p>by <span>Magnamious Systems</span> Pvt Ltd</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">🛡️ Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">🔐 Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">🔒 Access Admin Panel</button>
        </form>

    </div>

    <script src="/js/login.js" defer></script>
</body>
</html>
