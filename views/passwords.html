<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophos Audit Manager - Password Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        .header {
            background: #0f172a;
            border-bottom: 1px solid #475569;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo svg { width: 48px; height: 48px; }
        .logo h1 { font-size: 20px; font-weight: 600; }
        .nav-links { display: flex; gap: 24px; align-items: center; }
        .nav-links a { color: #94a3b8; text-decoration: none; font-size: 14px; padding: 8px 12px; border-radius: 6px; transition: background-color 0.2s; }
        .nav-links a:hover { background: #1e293b; color: #e2e8f0; }
        .nav-links a.active { background: linear-gradient(90deg, #0d9488 0%, #0f766e 100%); color: white; }
        .user-info span { color: #94a3b8; font-size: 14px; }
        .logout-btn { background: #1e293b; border: 1px solid #475569; padding: 8px 16px; border-radius: 6px; color: #94a3b8; cursor: pointer; font-size: 14px; }
        .logout-btn:hover { background: #334155; }
        .main-content { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-header h2 { font-size: 24px; font-weight: 600; }
        .add-btn { background: linear-gradient(90deg, #0d9488 0%, #0f766e 100%); border: none; padding: 12px 20px; border-radius: 8px; color: white; cursor: pointer; font-size: 14px; }
        .add-btn:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #475569; }
        th { background: #0f172a; color: #38bdf8; font-weight: 600; font-size: 14px; text-transform: uppercase; }
        tr:hover { background: rgba(255, 255, 255, 0.03); }
        .no-data { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <svg viewBox="0 0 64 64">
                    <rect width="64" height="64" rx="14" fill="#0d9488"/>
                    <text x="32" y="32" dy="0.35em" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#ffffff">SA</text>
                </svg>
                <h1>Sophos Audit Manager</h1>
            </div>
            <nav class="nav-links">
                <a href="/dashboard">Dashboard</a>
                <a href="/sites">Sites</a>
                <a href="/firewalls">Firewalls</a>
                <a href="/reports">Reports</a>
                <a href="/passwords" class="active">Password Manager</a>
            </nav>
            <div class="user-info">
                <span id="username">admin</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="page-header">
            <h2>🔐 Password Manager</h2>
            <button class="add-btn" onclick="addPassword()">Add Password</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Key Name</th>
                    <th>Site</th>
                    <th>Firewall</th>
                    <th>Value</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="pwTableBody">
                <tr><td colspan="5" class="no-data">Loading...</td></tr>
            </tbody>
        </table>
    </main>

    <script>
        checkAuth();

        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/me');
                if (!response.ok) window.location.href = '/login';
                else document.getElementById('username').textContent = (await response.json()).username;
            } catch (err) { window.location.href = '/login'; }
        }

        function logout() {
            fetch('/api/auth/logout', { method: 'POST' }).then(() => window.location.href = '/login');
        }

        async function loadPasswords() {
            try {
                const sites = await (await fetch('/api/sites')).json();
                let html = '';
                for (const site of sites) {
                    const passwords = await (await fetch('/api/passwords/site/' + site.id)).json();
                    passwords.forEach(pw => {
                        html += '<tr>' +
                            '<td>' + pw.key_name + '</td>' +
                            '<td>' + site.name + '</td>' +
                            '<td>' + (pw.firewall_id ? 'Firewall #' + pw.firewall_id : 'Site Level') + '</td>' +
                            '<td>🔒 encrypted • <button onclick="showPassword(' + pw.id + ')" style="background:none;border:none;color:#0d9488;cursor:pointer">Show</button></td>' +
                            '<td><button onclick="deletePassword(' + pw.id + ')" style="background:none;border:none;color:#dc2626;cursor:pointer">🗑️</button></td>' +
                            '</tr>';
                    });
                }
                document.getElementById('pwTableBody').innerHTML = html || '<tr><td colspan="5" class="no-data">No passwords stored yet</td></tr>';
            } catch (err) {
                document.getElementById('pwTableBody').innerHTML = '<tr><td colspan="5" class="no-data">Error loading passwords</td></tr>';
            }
        }

        async function showPassword(id) {
            if (!confirm('Show password value?')) return;
            try {
                const pw = await (await fetch('/api/passwords/' + id)).json();
                alert('Key: ' + pw.key_name + '\nValue: ' + pw.decrypted_value);
            } catch (err) { alert('Error retrieving password'); }
        }

        async function addPassword() {
            const sites = await (await fetch('/api/sites')).json();
            const siteId = prompt('Enter site ID:');
            const keyName = prompt('Enter key name (e.g., API Key):');
            const value = prompt('Enter value:');

            if (siteId && keyName && value) {
                await fetch('/api/passwords', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key_name: keyName, value, site_id: parseInt(siteId), firewall_id: null })
                });
                loadPasswords();
            }
        }

        async function deletePassword(id) {
            if (!confirm('Delete this password?')) return;
            try {
                await fetch('/api/passwords/' + id, { method: 'DELETE' });
                loadPasswords();
            } catch (err) { alert('Error deleting password'); }
        }

        loadPasswords();
    </script>
</body>
</html>
